<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Concessions POS (Live Sync)</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1e293b" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
    header h1 { font-size: 1.2rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #eab308; display: inline-block; }
    .status-dot.online { background: #22c55e; }
    .header-btns button { background: #334155; color: #f8fafc; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; margin-left: 6px; cursor: pointer; }

    .container { display: flex; flex: 1; overflow: hidden; }
    .menu-panel { flex: 3; padding: 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; align-content: start; }
    .cart-panel { flex: 2; min-width: 320px; background: #1e293b; border-left: 2px solid #334155; display: flex; flex-direction: column; }

    .item-btn { background: #334155; border: 2px solid #475569; border-radius: 10px; padding: 14px 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; user-select: none; transition: transform 0.05s, background-color 0.1s; min-height: 85px; }
    .item-btn:active { transform: scale(0.96); background: #475569; }
    .item-name { font-size: 1rem; font-weight: 600; margin-bottom: 4px; color: #fff; }
    .item-price { font-size: 0.9rem; color: #38bdf8; font-weight: 700; }

    .cart-items { flex: 1; overflow-y: auto; padding: 12px; }
    .cart-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #334155; }
    .cart-row-title { font-weight: 600; font-size: 0.95rem; }
    .cart-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { background: #334155; color: white; border: none; width: 30px; height: 30px; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-btn:active { background: #475569; }

    .cart-bottom { padding: 12px 16px; background: #111827; border-top: 2px solid #334155; }
    .total-row { display: flex; justify-content: space-between; font-size: 1.4rem; font-weight: 800; margin-bottom: 12px; color: #4ade80; }
    .tender-presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
    .tender-btn { background: #1f2937; border: 1px solid #4b5563; color: white; padding: 8px 0; border-radius: 6px; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-align: center; }
    .tender-btn:active { background: #374151; }
    .custom-tender { display: flex; gap: 6px; margin-bottom: 10px; }
    .custom-tender input { flex: 1; background: #0f172a; border: 1px solid #4b5563; border-radius: 6px; color: white; padding: 8px 12px; font-size: 1rem; text-align: right; }
    .change-banner { background: #064e3b; border: 1px solid #059669; color: #6ee7b7; padding: 10px; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; display: none; }
    .actions { display: flex; gap: 8px; }
    .btn-complete { flex: 2; background: #16a34a; border: none; color: white; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
    .btn-complete:active { background: #15803d; }
    .btn-clear { flex: 1; background: #dc2626; border: none; color: white; padding: 14px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal.active { display: flex; }
    .modal-card { background: #1e293b; border-radius: 12px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 20px; border: 1px solid #475569; }
    .modal-card h2 { margin-bottom: 12px; font-size: 1.3rem; }
    .modal-card textarea { width: 100%; height: 220px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.85rem; margin-bottom: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }

    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .menu-panel { flex: 1; }
      .cart-panel { flex: none; height: 50vh; border-left: none; border-top: 2px solid #334155; }
    }
  </style>

  <!-- Firebase Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      enableIndexedDbPersistence,
      getDocs,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // --- PASTE YOUR FIREBASE CONFIG HERE ---
    const firebaseConfig = {
      apiKey: "AIzaSyDWwjQv-HNtC7TOpQzZUmngaE-0likR6bQ",
      authDomain: "concessions-pos-d8e7f.firebaseapp.com",
      projectId: "concessions-pos-d8e7f",
      storageBucket: "concessions-pos-d8e7f.firebasestorage.app",
      messagingSenderId: "762523049509",
      appId: "1:762523049509:web:be9840b4641276599169cc"
    };
    // --------------------------------------

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Enable offline persistence so drops in signal don't break transactions
    enableIndexedDbPersistence(db).catch(err => {
      console.warn("Offline persistence failed:", err.code);
    });

    const salesCol = collection(db, "sales");
    let globalSales = [];

    // Real-time listener: syncs across all devices instantly
    const q = query(salesCol, orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
      document.getElementById('cloudStatus').classList.add('online');
      globalSales = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      window.globalSales = globalSales;
      if (document.getElementById('summaryModal').classList.contains('active')) {
        window.openSummaryModal();
      }
    }, (error) => {
      console.error("Sync error:", error);
      document.getElementById('cloudStatus').classList.remove('online');
    });

    // Expose completeSale to global window
    window.pushSaleToFirebase = async (sale) => {
      try {
        await addDoc(salesCol, sale);
      } catch (e) {
        console.error("Error logging sale: ", e);
      }
    };

    window.clearAllCloudSales = async () => {
      const snap = await getDocs(salesCol);
      const deletions = snap.docs.map(d => deleteDoc(doc(db, "sales", d.id)));
      await Promise.all(deletions);
    };
  </script>
</head>
<body>

  <header>
    <h1><span id="cloudStatus" class="status-dot"></span> Concessions POS</h1>
    <div class="header-btns">
      <button onclick="openMenuModal()">Menu</button>
      <button onclick="openSummaryModal()">Live Total</button>
    </div>
  </header>

  <div class="container">
    <div class="menu-panel" id="menuGrid"></div>

    <div class="cart-panel">
      <div class="cart-items" id="cartList">
        <p style="color: #94a3b8; text-align: center; margin-top: 30px;">Cart is empty. Tap items to add.</p>
      </div>

      <div class="cart-bottom">
        <div class="total-row">
          <span>Total:</span>
          <span id="totalAmount">$0.00</span>
        </div>

        <div class="tender-presets">
          <button class="tender-btn" onclick="applyTender('exact')">Exact</button>
          <button class="tender-btn" onclick="applyTender(5)">$5</button>
          <button class="tender-btn" onclick="applyTender(10)">$10</button>
          <button class="tender-btn" onclick="applyTender(20)">$20</button>
          <button class="tender-btn" onclick="applyTender(50)">$50</button>
        </div>

        <div class="custom-tender">
          <input type="number" step="0.25" id="tenderInput" placeholder="Cash Given ($)" oninput="calculateChange()" />
        </div>

        <div class="change-banner" id="changeBanner">
          Change Due: <span id="changeAmount">$0.00</span>
        </div>

        <div class="actions">
          <button class="btn-clear" onclick="clearCart()">Clear</button>
          <button class="btn-complete" onclick="completeSale()">Complete Sale</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="menuModal">
    <div class="modal-card">
      <h2>Edit Menu (JSON)</h2>
      <textarea id="menuJsonArea"></textarea>
      <div class="modal-actions">
        <button class="modal-btn" style="background:#475569; color:white;" onclick="closeModal('menuModal')">Cancel</button>
        <button class="modal-btn" style="background:#38bdf8; color:#0f172a;" onclick="saveMenu()">Save Menu</button>
      </div>
    </div>
  </div>

  <div class="modal" id="summaryModal">
    <div class="modal-card">
      <h2>Live Combined Shift Total</h2>
      <div id="summaryContent" style="margin-bottom: 16px; font-size: 0.95rem; line-height: 1.6;"></div>
      <div class="modal-actions">
        <button class="modal-btn" style="background:#dc2626; color:white;" onclick="resetShift()">Reset Shift</button>
        <button class="modal-btn" style="background:#16a34a; color:white;" onclick="exportCSV()">Export CSV</button>
        <button class="modal-btn" style="background:#475569; color:white;" onclick="closeModal('summaryModal')">Close</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_MENU = [
      { id: 1, name: "Hot Dog", price: 3.00 },
      { id: 2, name: "Nachos", price: 3.50 },
      { id: 3, name: "Popcorn", price: 2.00 },
      { id: 4, name: "Pretzel", price: 2.50 },
      { id: 5, name: "Soda / Gatorade", price: 2.00 },
      { id: 6, name: "Bottled Water", price: 1.50 },
      { id: 7, name: "Candy Box", price: 2.00 },
      { id: 8, name: "Chips", price: 1.00 },
      { id: 9, name: "Pickle", price: 1.00 },
      { id: 10, name: "Ring Pop", price: 0.50 }
    ];

    let menu = JSON.parse(localStorage.getItem('concessions_menu')) || DEFAULT_MENU;
    let cart = {};

    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      grid.innerHTML = '';
      menu.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'item-btn';
        btn.innerHTML = `<div class="item-name">${item.name}</div><div class="item-price">$${item.price.toFixed(2)}</div>`;
        btn.onclick = () => addToCart(item.id);
        grid.appendChild(btn);
      });
    }

    function addToCart(itemId) {
      cart[itemId] = (cart[itemId] || 0) + 1;
      renderCart();
    }

    function changeQty(itemId, delta) {
      if (!cart[itemId]) return;
      cart[itemId] += delta;
      if (cart[itemId] <= 0) delete cart[itemId];
      renderCart();
    }

    function getCartTotal() {
      return Object.entries(cart).reduce((sum, [id, qty]) => {
        const item = menu.find(m => m.id == id);
        return sum + (item ? item.price * qty : 0);
      }, 0);
    }

    function renderCart() {
      const cartList = document.getElementById('cartList');
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        cartList.innerHTML = '<p style="color: #94a3b8; text-align: center; margin-top: 30px;">Cart is empty. Tap items to add.</p>';
      } else {
        cartList.innerHTML = '';
        keys.forEach(id => {
          const item = menu.find(m => m.id == id);
          if (!item) return;
          const row = document.createElement('div');
          row.className = 'cart-row';
          row.innerHTML = `
            <div>
              <div class="cart-row-title">${item.name}</div>
              <div style="font-size:0.8rem; color:#94a3b8;">$${item.price.toFixed(2)} ea</div>
            </div>
            <div class="cart-controls">
              <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
              <span style="font-weight:700; width:18px; text-align:center;">${cart[id]}</span>
              <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          `;
          cartList.appendChild(row);
        });
      }

      const total = getCartTotal();
      document.getElementById('totalAmount').innerText = `$${total.toFixed(2)}`;
      calculateChange();
    }

    function applyTender(val) {
      const total = getCartTotal();
      if (val === 'exact') {
        document.getElementById('tenderInput').value = total.toFixed(2);
      } else {
        document.getElementById('tenderInput').value = val.toFixed(2);
      }
      calculateChange();
    }

    function calculateChange() {
      const total = getCartTotal();
      const tendered = parseFloat(document.getElementById('tenderInput').value);
      const banner = document.getElementById('changeBanner');
      const changeDisplay = document.getElementById('changeAmount');

      if (!isNaN(tendered) && tendered >= total && total > 0) {
        const change = tendered - total;
        changeDisplay.innerText = `$${change.toFixed(2)}`;
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }
    }

    function clearCart() {
      cart = {};
      document.getElementById('tenderInput').value = '';
      renderCart();
    }

    function completeSale() {
      const total = getCartTotal();
      if (total === 0) return;

      const sale = {
        timestamp: new Date().toISOString(),
        total: total,
        items: { ...cart }
      };

      // Push to shared cloud
      if (window.pushSaleToFirebase) {
        window.pushSaleToFirebase(sale);
      }

      clearCart();
    }

    function openMenuModal() {
      document.getElementById('menuJsonArea').value = JSON.stringify(menu, null, 2);
      document.getElementById('menuModal').classList.add('active');
    }

    function saveMenu() {
      try {
        const parsed = JSON.parse(document.getElementById('menuJsonArea').value);
        if (Array.isArray(parsed)) {
          menu = parsed;
          localStorage.setItem('concessions_menu', JSON.stringify(menu));
          renderMenu();
          renderCart();
          closeModal('menuModal');
        }
      } catch (err) {
        alert('Invalid JSON');
      }
    }

    window.openSummaryModal = function() {
      const sales = window.globalSales || [];
      const totalRevenue = sales.reduce((sum, s) => sum + (s.total || 0), 0);
      const totalOrders = sales.length;
      
      const itemTotals = {};
      sales.forEach(s => {
        if (s.items) {
          for (const [id, qty] of Object.entries(s.items)) {
            itemTotals[id] = (itemTotals[id] || 0) + qty;
          }
        }
      });

      let itemsHtml = '<ul style="margin-top:8px; padding-left:20px;">';
      for (const [id, qty] of Object.entries(itemTotals)) {
        const item = menu.find(m => m.id == id);
        if (item) {
          itemsHtml += `<li>${item.name}: <strong>${qty}</strong></li>`;
        }
      }
      itemsHtml += '</ul>';

      const content = `
        <p><strong>Combined Sales:</strong> $${totalRevenue.toFixed(2)}</p>
        <p><strong>Total Transactions:</strong> ${totalOrders}</p>
        <h3 style="margin-top:12px; font-size:1rem; color:#38bdf8;">Total Items Sold Across All Devices:</h3>
        ${itemsHtml}
      `;

      document.getElementById('summaryContent').innerHTML = content;
      document.getElementById('summaryModal').classList.add('active');
    };

    function resetShift() {
      if (confirm('Are you sure you want to clear the shift database for EVERYONE?')) {
        if (window.clearAllCloudSales) {
          window.clearAllCloudSales();
        }
      }
    }

    function exportCSV() {
      const sales = window.globalSales || [];
      if (sales.length === 0) {
        alert('No sales to export.');
        return;
      }
      let csv = 'Timestamp,Total\n';
      sales.forEach(s => {
        csv += `"${s.timestamp}",${(s.total || 0).toFixed(2)}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `combined_shift_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`);
      a.click();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    renderMenu();
    renderCart();
  </script>
</body>
</html>
